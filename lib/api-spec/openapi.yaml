openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AfroCart marketplace and local delivery API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Store catalog operations
  - name: orders
    description: Customer orders and delivery tracking
  - name: operations
    description: Admin and rider operations
  - name: reports
    description: Admin reporting and performance analytics
  - name: Storage
    description: Product image upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List store products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Add a product to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Remove a product from the catalog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product removed
        "404":
          description: Product not found
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for the current demo role
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [customer, super_admin, rider]
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order with tracking timeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Change order status or rider assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [operations]
      summary: Get operations dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /riders:
    get:
      operationId: listRiders
      tags: [operations]
      summary: List available riders
      responses:
        "200":
          description: Rider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rider"
  /notifications:
    get:
      operationId: listNotifications
      tags: [operations]
      summary: List recent arrival and order notifications
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /reports/overview:
    get:
      operationId: getReportsOverview
      tags: [reports]
      summary: Get admin reports overview
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 7d
      responses:
        "200":
          description: Reporting overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsOverview"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for a product image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a product image object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image object
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, description, price, category, origin, imageUrl, inStock, featured]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        category: { type: string }
        origin: { type: string }
        imageUrl: { type: string }
        inStock: { type: boolean }
        featured: { type: boolean }
    ProductInput:
      type: object
      required: [name, description, price, category, origin, imageUrl]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        price: { type: number, minimum: 0 }
        category: { type: string }
        origin: { type: string }
        imageUrl: { type: string }
        inStock: { type: boolean }
        featured: { type: boolean }
    ProductUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        category: { type: string }
        origin: { type: string }
        imageUrl: { type: string }
        inStock: { type: boolean }
        featured: { type: boolean }
    OrderItem:
      type: object
      required: [productId, name, quantity, price]
      properties:
        productId: { type: integer }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        price: { type: number, minimum: 0 }
    OrderEvent:
      type: object
      required: [label, description, timestamp, completed]
      properties:
        label: { type: string }
        description: { type: string }
        timestamp: { type: string }
        completed: { type: boolean }
    Order:
      type: object
      required: [id, customerName, customerAddress, items, subtotal, deliveryFee, total, status, riderName, riderType, createdAt, eta, events]
      properties:
        id: { type: integer }
        customerName: { type: string }
        customerAddress: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        status:
          type: string
          enum: [received, preparing, ready, picked_up, in_transit, delivered]
        riderName: { type: ["string", "null"] }
        riderType:
          type: string
          enum: [company, partner, unassigned]
        createdAt: { type: string }
        eta: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/OrderEvent" }
    OrderInput:
      type: object
      required: [customerName, customerAddress, items]
      properties:
        customerName: { type: string }
        customerAddress: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderItem" }
        deliveryNote: { type: ["string", "null"] }
        riderType:
          type: string
          enum: [company, partner]
    OrderUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [received, preparing, ready, picked_up, in_transit, delivered]
        riderName: { type: ["string", "null"] }
        riderType:
          type: string
          enum: [company, partner, unassigned]
    Rider:
      type: object
      required: [id, name, type, status, phone, activeOrders]
      properties:
        id: { type: integer }
        name: { type: string }
        type:
          type: string
          enum: [company, partner]
        status:
          type: string
          enum: [available, delivering, offline]
        phone: { type: string }
        activeOrders: { type: integer }
    DashboardSummary:
      type: object
      required: [revenueToday, activeOrders, deliveredToday, lowStock, ordersByStatus]
      properties:
        revenueToday: { type: number }
        activeOrders: { type: integer }
        deliveredToday: { type: integer }
        lowStock: { type: integer }
        ordersByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
    Notification:
      type: object
      required: [id, title, message, time, kind, read]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        time: { type: string }
        kind:
          type: string
          enum: [arrival, order, system]
        read: { type: boolean }
    ReportsOverview:
      type: object
      required: [range, revenue, orders, averageOrderValue, deliveryRate, dailyRevenue, topProducts, riderPerformance]
      properties:
        range:
          type: string
          enum: [7d, 30d, 90d]
        revenue: { type: number }
        orders: { type: integer }
        averageOrderValue: { type: number }
        deliveryRate: { type: number }
        dailyRevenue:
          type: array
          items:
            type: object
            required: [label, revenue, orders]
            properties:
              label: { type: string }
              revenue: { type: number }
              orders: { type: integer }
        topProducts:
          type: array
          items:
            type: object
            required: [name, units, revenue]
            properties:
              name: { type: string }
              units: { type: integer }
              revenue: { type: number }
        riderPerformance:
          type: array
          items:
            type: object
            required: [name, type, deliveries, onTimeRate]
            properties:
              name: { type: string }
              type: { type: string }
              deliveries: { type: integer }
              onTimeRate: { type: number }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }

