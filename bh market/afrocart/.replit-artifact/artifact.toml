kind = "web"
previewPath = "/"
title = "AfroCart"
description = "A warm, responsive marketplace for Ghanaian and African foods in the USA, with customer ordering, delivery tracking, admin catalog management, rider workflows, and arrival notifications."
version = "1.0.0"
id = "artifacts/afrocart"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20922

[services.development]
run = "pnpm --filter @workspace/afrocart run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/afrocart", "run", "build" ]
serve = "static"
publicDir = "artifacts/afrocart/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20922"
BASE_PATH = "/"
